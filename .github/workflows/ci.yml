name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    # The engine and its scenario runner are plain net10.0, so the cheapest runner is the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: tools/check.sh fast
      # Every match must reach full time without stalling, and the figures over all of them
      # must meet the pass marks in MatchRunner.
      - run: tools/check.sh matches
      # Identical squads add the marks for balance between the two teams.
      - run: tools/check.sh matches 100 1 equal

  build-windows:
    # Only Windows can build the whole solution, because it includes the WPF tuning
    # host. The MonoGame host is also built here rather than on Linux: its spritefont
    # names Arial, and a Linux content build has not been tried.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Swof.sln --nologo

  build-android:
    # The Android launcher compiles the same game sources against MonoGame's Android framework.
    # Windows because the spritefont names Arial; the runner image brings the Android SDK and a JDK.
    # This proves the game compiles and packages for a phone. Nobody has run the package on one.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install android
      - run: dotnet build Swof.Droid/Swof.Droid.csproj -c Release --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: swof-android-apk
          path: Swof.Droid/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: error
